; UnsubAutoATC - mute or hide private messages from chosen callsigns in vPilot.
;
; Changes apply on the next message from a listed sender. No restart needed.
;
; Every action below is one of:
;   show  normal message with sound
;   mute  message appears, no sound
;   hide  message never appears (it is still written to the log)
;
; Examples:
;   Everything, silently ............... MuteAll=true
;   Only whitelisted, with sound ....... Mode=hide  WhitelistMode=show
;   Only whitelisted, silently ......... Mode=hide  WhitelistMode=mute
;   Everything, whitelisted with sound . Mode=mute  WhitelistMode=show

[Filter]
; false turns the plugin off completely.
Enabled=true

; Callsigns to filter, comma-separated. Any callsign works, not just AUTO_ATC.
Senders=AUTO_ATC

; true = every message from the senders above arrives silently, and the
; settings below are ignored.
MuteAll=false

; Messages containing one of these keywords get WhitelistMode.
; Comma-separated, whole words, not case-sensitive. Empty = none.
Whitelist=squawk
WhitelistMode=show

; All other messages from the senders above get Mode.
Mode=hide

; Write every message from a listed sender, and what was done with it, to
; UnsubAutoATC.log next to this file.
Log=true
